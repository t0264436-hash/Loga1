<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Análise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171A;
    --surface: #1B1F23;
    --line: #2A2F34;
    --text: #E8E6E0;
    --text-muted: #8B9198;
    --accent: #C9A227;
    --live: #B85450;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 10px;
    z-index: 10;
  }
  header h1 {
    margin: 0 0 12px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .date-nav button {
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 16px;
    padding: 6px 12px;
    border-radius: 4px;
  }
  .date-nav .data-atual {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }

  input#busca {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 4px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
  }
  input#busca::placeholder { color: var(--text-muted); }

  #status {
    padding: 24px 16px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .liga-grupo { border-bottom: 1px solid var(--line); }
  .liga-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
  }
  .liga-nome {
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .liga-pais { color: var(--text-muted); opacity: 0.7; font-size: 11px; }
  .liga-seta { color: var(--text-muted); font-size: 12px; transition: transform 0.15s; }
  .liga-grupo.aberto .liga-seta { transform: rotate(90deg); }

  .jogos-lista { display: none; }
  .liga-grupo.aberto .jogos-lista { display: block; }

  .jogo-linha {
    display: grid;
    grid-template-columns: 44px 1fr 48px;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }
  .jogo-linha:active { background: var(--surface); }

  .jogo-hora {
    font-size: 13px;
    color: var(--text-muted);
    min-width: 44px;
  }
  .jogo-hora.ao-vivo { color: var(--live); }

  .escudo { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
  .liga-logo { width: 16px; height: 16px; object-fit: contain; margin-right: 6px; vertical-align: middle; }
  .time-com-logo { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.3; }
  .jogo-times {
    flex: 1;
    font-size: 14px;
    line-height: 1.5;
  }
  .jogo-placar {
    font-size: 14px;
    min-width: 32px;
    text-align: right;
    color: var(--text-muted);
  }

  .vazio { padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 14px; }

  .secao-titulo {
    padding: 16px 16px 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--accent);
    border-top: 1px solid var(--line);
  }

  .sub-liga-label {
    padding: 8px 16px 4px 24px;
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0.8;
  }
</style>
</head>
<body>

<header>
  <h1>Central de Análise</h1>
  <div class="date-nav">
    <button id="btnAnterior" aria-label="Dia anterior">‹</button>
    <span class="data-atual" id="dataAtual"></span>
    <button id="btnProximo" aria-label="Próximo dia">›</button>
  </div>
  <input type="text" id="busca" placeholder="Buscar time ou liga...">
</header>

<div id="status">Carregando jogos do dia...</div>
<div id="lista"></div>

<script>
  // ---------- CONFIGURAÇÃO ----------
  const WORKER_URL = "https://cg-la-casa-das-bets.linoariane114.workers.dev";
  // -----------------------------------

  let dataSelecionada = new Date();
  let jogosDoDia = [];

  function formatarDataISO(d) {
    return d.toISOString().split('T')[0];
  }

  function formatarDataExibicao(d) {
    return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
  }

  function formatarHora(isoString) {
    const d = new Date(isoString);
    return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  async function carregarJogos() {
    const status = document.getElementById('status');
    const lista = document.getElementById('lista');
    status.textContent = 'Carregando jogos do dia...';
    status.style.display = 'block';
    lista.innerHTML = '';

    const dataISO = formatarDataISO(dataSelecionada);
    document.getElementById('dataAtual').textContent = formatarDataExibicao(dataSelecionada);

    try {
      const resp = await fetch(`${WORKER_URL}/jogos?date=${dataISO}`);
      const data = await resp.json();

      if (data.errors && Object.keys(data.errors).length > 0) {
        status.textContent = 'Erro ao buscar jogos: ' + JSON.stringify(data.errors);
        return;
      }

      jogosDoDia = data.response || [];
      status.style.display = 'none';
      renderizarLista(jogosDoDia);
    } catch (err) {
      status.textContent = 'Erro de conexão: ' + err;
    }
  }

  // Ligas que devem sempre aparecer primeiro, nessa ordem, antes de qualquer outra.
  // (IDs da API-Football: Brasileirão, Copa do Brasil, Libertadores, Champions,
  //  Europa League, Conference League, Premier League, La Liga, Serie A, Bundesliga, Ligue 1, Série B)
  const LIGAS_PRIORITARIAS = [71, 73, 13, 2, 3, 848, 39, 140, 135, 78, 61, 72];

  function agruparPorLiga(jogos) {
    const grupos = {};
    for (const jogo of jogos) {
      const chave = jogo.league.id;
      if (!grupos[chave]) {
        grupos[chave] = { liga: jogo.league, jogos: [] };
      }
      grupos[chave].jogos.push(jogo);
    }

    return Object.values(grupos).sort((a, b) => {
      const prioA = LIGAS_PRIORITARIAS.indexOf(a.liga.id);
      const prioB = LIGAS_PRIORITARIAS.indexOf(b.liga.id);
      const temPrioA = prioA !== -1;
      const temPrioB = prioB !== -1;

      if (temPrioA && temPrioB) return prioA - prioB; // ambas prioritarias: respeita a ordem da lista
      if (temPrioA) return -1; // so A e prioritaria: A vem primeiro
      if (temPrioB) return 1;  // so B e prioritaria: B vem primeiro
      return b.jogos.length - a.jogos.length; // nenhuma prioritaria: mais jogos primeiro
    });
  }

  function renderizarLista(jogos) {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';

    if (jogos.length === 0) {
      lista.innerHTML = '<div class="vazio">Nenhum jogo encontrado.</div>';
      return;
    }

    // Separa jogos das ligas prioritarias do resto
    const jogosPrioritarios = jogos.filter(j => LIGAS_PRIORITARIAS.includes(j.league.id));
    const jogosResto = jogos.filter(j => !LIGAS_PRIORITARIAS.includes(j.league.id));

    // ---------- Bloco 1: ligas prioritarias, ja abertas ----------
    if (jogosPrioritarios.length > 0) {
      const grupos = agruparELigaOrdenada(jogosPrioritarios);
      grupos.forEach((grupo, index) => {
        lista.appendChild(criarBlocoLiga(grupo.liga, grupo.jogos, true));
      });

      const divisor = document.createElement('div');
      divisor.className = 'secao-titulo';
      divisor.textContent = 'TODOS OS PAÍSES';
      lista.appendChild(divisor);
    }

    // ---------- Bloco 2: todos os paises, ordem alfabetica ----------
    const porPais = {};
    jogosResto.forEach(jogo => {
      const pais = jogo.league.country || 'World';
      if (!porPais[pais]) porPais[pais] = {};
      const ligaId = jogo.league.id;
      if (!porPais[pais][ligaId]) porPais[pais][ligaId] = { liga: jogo.league, jogos: [] };
      porPais[pais][ligaId].jogos.push(jogo);
    });

    const paisesOrdenados = Object.keys(porPais).sort((a, b) => a.localeCompare(b));

    paisesOrdenados.forEach(pais => {
      const ligasDoPais = Object.values(porPais[pais]);
      const totalJogos = ligasDoPais.reduce((soma, l) => soma + l.jogos.length, 0);

      const divPais = document.createElement('div');
      divPais.className = 'liga-grupo';

      const header = document.createElement('div');
      header.className = 'liga-header';
      header.innerHTML = `
        <span class="liga-nome">${pais.toUpperCase()} <span class="liga-pais">— ${totalJogos} jogo${totalJogos > 1 ? 's' : ''}</span></span>
        <span class="liga-seta">▸</span>
      `;
      header.onclick = () => divPais.classList.toggle('aberto');

      const divConteudo = document.createElement('div');
      divConteudo.className = 'jogos-lista';

      // se o pais tiver mais de uma liga, mostra o nome da liga como sub-rotulo
      const maisDeUmaLiga = ligasDoPais.length > 1;
      ligasDoPais
        .sort((a, b) => b.jogos.length - a.jogos.length)
        .forEach(grupoLiga => {
          if (maisDeUmaLiga) {
            const subLabel = document.createElement('div');
            subLabel.className = 'sub-liga-label';
            subLabel.textContent = grupoLiga.liga.name;
            divConteudo.appendChild(subLabel);
          }
          grupoLiga.jogos.forEach(jogo => divConteudo.appendChild(criarLinhaJogo(jogo)));
        });

      divPais.appendChild(header);
      divPais.appendChild(divConteudo);
      lista.appendChild(divPais);
    });
  }

  function agruparELigaOrdenada(jogos) {
    const grupos = {};
    jogos.forEach(jogo => {
      const chave = jogo.league.id;
      if (!grupos[chave]) grupos[chave] = { liga: jogo.league, jogos: [] };
      grupos[chave].jogos.push(jogo);
    });
    return LIGAS_PRIORITARIAS
      .map(id => grupos[id])
      .filter(Boolean);
  }

  function criarBlocoLiga(liga, jogosDaLiga, aberto) {
    const divGrupo = document.createElement('div');
    divGrupo.className = 'liga-grupo' + (aberto ? ' aberto' : '');

    const header = document.createElement('div');
    header.className = 'liga-header';
    const logo = liga.logo ? `<img class="liga-logo" src="${liga.logo}" alt="" onerror="this.style.display='none'">` : '';
    header.innerHTML = `
      <span class="liga-nome">${logo}${liga.name.toUpperCase()} <span class="liga-pais">— ${liga.country || ""}</span></span>
      <span class="liga-seta">▸</span>
    `;
    header.onclick = () => divGrupo.classList.toggle('aberto');

    const divJogos = document.createElement('div');
    divJogos.className = 'jogos-lista';
    jogosDaLiga.forEach(jogo => divJogos.appendChild(criarLinhaJogo(jogo)));

    divGrupo.appendChild(header);
    divGrupo.appendChild(divJogos);
    return divGrupo;
  }

  function criarLinhaJogo(jogo) {
    const status = jogo.fixture.status.short;
    const aoVivo = !['NS', 'FT', 'PST', 'CANC', 'AET', 'PEN'].includes(status);
    const finalizado = ['FT', 'AET', 'PEN'].includes(status);

    let horaOuStatus;
    if (aoVivo) {
      horaOuStatus = `<span class="jogo-hora ao-vivo mono">${jogo.fixture.status.elapsed || "?"} '</span>`;
    } else if (finalizado) {
      horaOuStatus = `<span class="jogo-hora mono">FIM</span>`;
    } else {
      horaOuStatus = `<span class="jogo-hora mono">${formatarHora(jogo.fixture.date)}</span>`;
    }

    const placar = (finalizado || aoVivo)
      ? `<span class="jogo-placar mono">${jogo.goals.home ?? '-'} : ${jogo.goals.away ?? '-'}</span>`
      : `<span class="jogo-placar mono">vs</span>`;

    const logoH = jogo.teams.home.logo || "";
    const logoA = jogo.teams.away.logo || "";

    const linha = document.createElement('a');
    linha.className = 'jogo-linha';
    linha.href = `analise.html?fixture=${jogo.fixture.id}&date=${formatarDataISO(dataSelecionada)}`;
    linha.innerHTML = `
      ${horaOuStatus}
      <span class="jogo-times">
        <span class="time-com-logo">
          <img class="escudo" src="${logoH}" alt="" onerror="this.style.visibility='hidden'">
          <span>${jogo.teams.home.name}</span>
        </span>
        <span class="time-com-logo">
          <img class="escudo" src="${logoA}" alt="" onerror="this.style.visibility='hidden'">
          <span>${jogo.teams.away.name}</span>
        </span>
      </span>
      ${placar}
    `;
    return linha;
  }

  document.getElementById('busca').addEventListener('input', (e) => {
    const termo = e.target.value.trim().toLowerCase();
    if (!termo) {
      renderizarLista(jogosDoDia);
      return;
    }
    const filtrados = jogosDoDia.filter(j =>
      j.teams.home.name.toLowerCase().includes(termo) ||
      j.teams.away.name.toLowerCase().includes(termo) ||
      j.league.name.toLowerCase().includes(termo) ||
      j.league.country.toLowerCase().includes(termo)
    );
    renderizarLista(filtrados);
  });

  document.getElementById('btnAnterior').onclick = () => {
    dataSelecionada.setDate(dataSelecionada.getDate() - 1);
    carregarJogos();
  };
  document.getElementById('btnProximo').onclick = () => {
    dataSelecionada.setDate(dataSelecionada.getDate() + 1);
    carregarJogos();
  };

  carregarJogos();
</script>

</body>
</html>
